name: Extract VoiceBook AI Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -o VoiceBook-AI-Fresh-Project.zip -d extracted
          cp -R extracted/. .
          rm -rf extracted

      - name: Save Android project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md build.gradle gradle.properties settings.gradle
          git commit -m "Add VoiceBook AI Android project"
          git push
